services:
  test-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: devflow_test
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow_test
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U devflow -d devflow_test"]
      interval: 2s
      retries: 20
