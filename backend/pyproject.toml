[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-recode"
version = "0.1.0"
description = "Persistent GitHub development supervisor"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "SQLAlchemy>=2.0.36,<2.1",
 "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
 "pydantic-settings>=2.7,<3", "docker>=7.1,<8", "lark-oapi==1.7.5"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
[tool.setuptools.packages.find]
include = ["devflow*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
